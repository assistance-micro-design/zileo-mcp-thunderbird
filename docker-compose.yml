# Thunderbird MCP Server - Docker Compose Configuration
#
# Architecture:
#   The container runs a standalone WebSocket bridge server on port 9876.
#   This bridge acts as a relay between Thunderbird extension and MCP clients.
#
# Usage:
#   docker-compose up -d                              # Start bridge in background
#   docker-compose logs -f                            # View logs
#   docker-compose down                               # Stop and remove
#
# Running MCP commands:
#   docker exec -i thunderbird-mcp-server node dist/index.js
#
#   The MCP server will automatically connect to the running bridge in client mode.
#   Multiple MCP instances can share the same bridge.
#
# For MCP client integration (Claude Desktop, etc.):
#   Configure command: docker exec -i thunderbird-mcp-server node dist/index.js

version: '3.8'

services:
  thunderbird-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: thunderbird-mcp:latest
    container_name: thunderbird-mcp-server

    # Environment configuration
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - THUNDERBIRD_PORT=${THUNDERBIRD_PORT:-9876}

    # Port mapping for WebSocket connection to Thunderbird extension
    # The extension connects to this port from the host
    ports:
      - "${THUNDERBIRD_PORT:-9876}:9876"

    # Volume for persistent logs
    volumes:
      - thunderbird-mcp-logs:/app/logs

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

    # Restart policy
    restart: unless-stopped

    # Network configuration
    networks:
      - mcp-network

    # Health check - verify WebSocket bridge is listening
    healthcheck:
      test: ["CMD", "node", "-e", "const net = require('net'); const s = new net.Socket(); s.setTimeout(5000); s.connect(9876, '127.0.0.1', () => { s.destroy(); process.exit(0); }); s.on('error', () => process.exit(1)); s.on('timeout', () => { s.destroy(); process.exit(1); });"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Keep container running with stdin open for 'docker exec' commands
    stdin_open: true

  # Optional: Development mode with hot reload
  thunderbird-mcp-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: thunderbird-mcp:dev
    container_name: thunderbird-mcp-dev
    profiles:
      - dev

    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - THUNDERBIRD_PORT=9876

    ports:
      - "9876:9876"

    volumes:
      - ./server/src:/app/server/src:ro
      - thunderbird-mcp-logs:/app/logs

    networks:
      - mcp-network

volumes:
  thunderbird-mcp-logs:
    driver: local

networks:
  mcp-network:
    driver: bridge
