# Zileo MCP — Thunderbird — Docker Compose Configuration
#
# Architecture:
#   The container runs a standalone WebSocket bridge server on port 9876.
#   This bridge acts as a relay between Thunderbird extension and MCP clients.
#
# Usage:
#   docker-compose up -d                              # Start bridge in background
#   docker-compose logs -f                            # View logs
#   docker-compose down                               # Stop and remove
#
# Running MCP commands:
#   docker exec -i zileo-mcp-thunderbird-server node dist/index.js
#
#   The MCP server will automatically connect to the running bridge in client mode.
#   Multiple MCP instances can share the same bridge.
#
# For MCP client integration (Claude Desktop, etc.):
#   Configure command: docker exec -i zileo-mcp-thunderbird-server node dist/index.js

services:
  zileo-mcp-thunderbird:
    build:
      context: .
      dockerfile: Dockerfile
    image: zileo-mcp-thunderbird:latest
    container_name: zileo-mcp-thunderbird-server

    # Environment configuration
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - THUNDERBIRD_PORT=${THUNDERBIRD_PORT:-9876}

    # Port mapping for WebSocket connection to Thunderbird extension
    # The extension connects to this port from the host
    # SEC-REVIEW-008: Bind to localhost only to prevent network exposure
    ports:
      - "127.0.0.1:${THUNDERBIRD_PORT:-9876}:9876"

    # Volume for persistent logs
    volumes:
      - zileo-mcp-thunderbird-logs:/app/logs

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

    # Restart policy
    restart: unless-stopped

    # Network configuration
    networks:
      - mcp-network

    # Health check - verify HTTP /health endpoint (SEC-REVIEW-013)
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http = require('http'); http.get('http://127.0.0.1:9876/health', r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>{ try { const j=JSON.parse(d); process.exit(j.status==='ok'?0:1); } catch { process.exit(1); }}); }).on('error',()=>process.exit(1));",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Keep container running with stdin open for 'docker exec' commands
    stdin_open: true

  # Optional: Development mode with hot reload
  zileo-mcp-thunderbird-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: zileo-mcp-thunderbird:dev
    container_name: zileo-mcp-thunderbird-dev
    profiles:
      - dev

    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - THUNDERBIRD_PORT=9876

    # SEC-REVIEW-008: Bind to localhost only
    ports:
      - "127.0.0.1:9876:9876"

    volumes:
      - ./server/src:/app/server/src:ro
      - zileo-mcp-thunderbird-logs:/app/logs

    # Same operational guarantees as production:
    # stdin open for `docker exec -i`, health check, resource limits.
    stdin_open: true

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http = require('http'); http.get('http://127.0.0.1:9876/health', r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>{ try { const j=JSON.parse(d); process.exit(j.status==='ok'?0:1); } catch { process.exit(1); }}); }).on('error',()=>process.exit(1));",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - mcp-network

volumes:
  zileo-mcp-thunderbird-logs:
    driver: local

networks:
  mcp-network:
    driver: bridge
