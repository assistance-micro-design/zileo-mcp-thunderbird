<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thunderbird MCP - Tool Permissions</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --surface: #2a2a3c;
      --surface-hover: #323248;
      --text: #e0e0f0;
      --text-muted: #9090b0;
      --border: #3a3a50;
      --accent: #7c7cf0;
      --read: #4caf50;
      --read-bg: rgba(76, 175, 80, 0.15);
      --modify: #ff9800;
      --modify-bg: rgba(255, 152, 0, 0.15);
      --destructive: #f44336;
      --destructive-bg: rgba(244, 67, 54, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.5;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: background 0.15s;
    }
    button:hover { background: var(--surface-hover); }
    button:active { transform: scale(0.97); }

    .domain-section {
      margin-bottom: 16px;
    }

    .domain-header {
      font-size: 0.95rem;
      font-weight: 600;
      padding: 8px 12px;
      background: var(--surface);
      border-radius: 8px 8px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .domain-count {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 400;
    }

    .tool-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
      overflow: hidden;
    }

    .tool-row {
      display: flex;
      align-items: center;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .tool-row:last-child { border-bottom: none; }
    .tool-row:hover { background: var(--surface-hover); }
    .tool-row.disabled { opacity: 0.5; }

    .tool-name {
      flex: 1;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.82rem;
    }

    .tier-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-right: 12px;
      min-width: 75px;
      text-align: center;
    }
    .tier-read { background: var(--read-bg); color: var(--read); }
    .tier-modify { background: var(--modify-bg); color: var(--modify); }
    .tier-destructive { background: var(--destructive-bg); color: var(--destructive); }

    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--border);
      border-radius: 22px;
      transition: 0.2s;
    }
    .toggle-slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: var(--text);
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider {
      background: var(--accent);
    }
    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(18px);
    }

    .status-bar {
      margin-top: 16px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .status-bar .saved {
      color: var(--read);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .status-bar .saved.visible { opacity: 1; }
  </style>
</head>
<body>
  <h1>MCP Tool Permissions</h1>
  <p class="subtitle">Control which MCP tools AI assistants can use. Destructive tools are disabled by default.</p>

  <div class="actions">
    <button id="btn-enable-all">Enable All</button>
    <button id="btn-read-only">Read Only</button>
    <button id="btn-read-modify">Read + Modify</button>
    <button id="btn-disable-destructive">Disable Destructive</button>
  </div>

  <div id="tools-container"></div>

  <div class="status-bar">
    <span id="status-summary"></span>
    <span id="status-saved" class="saved">Saved</span>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
